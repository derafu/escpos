# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/derafu/escpos/resources/config/escpos-services.yaml' }
#
# Rendering and delivery helpers are shared and hold no print-job state.
# Construct EscposPrinter and its backend per job, using that job's options;
# neither is registered here because both retain mutable printer state.

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Specialized concrete helpers without separate interface contracts.
    Derafu\Escpos\Renderer\Pdf417Renderer: ~

    Derafu\Escpos\Transport\NetworkTransport: ~

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    Derafu\Escpos\Translation\EscposTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']
